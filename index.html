<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livre</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <header class="pb-5 bg-blue-950">
        <nav class="flex flex-col md:flex-row justify-start pt-5 px-4 md:px-10 items-center gap-4">
            <div><img class="w-10 md:w-15" src="images/book.png" alt="logo" /></div>
            <h1 class="font-bold text-white text-lg sm:text-xl md:text-2xl">BookManager</h1>
        </nav>
    </header>

    <div class="flex flex-col md:flex-row">

        <aside class=" w-full md:w-64 shrink-0 border-b md:border-b-0 md:border-r border-slate-200 rounded-lg px-3 md:px-6 py-4 md:py-8">
            <nav class="grid grid-cols-3 md:flex md:flex-col gap-2">
                <a href="#accueil" class="rounded-lg bg-indigo-50 px-2 sm:px-4 py-3 text-center md:text-left text-sm sm:text-base font-medium font-serif text-indigo-600">Accueil</a>
                <a href="#mes-livres" class="rounded-lg px-2 sm:px-4 py-3 text-center md:text-left text-sm sm:text-base text-slate-700 font-serif">Mes livres</a>
                <a href="#ajouter-livre" class="rounded-lg px-2 sm:px-4 py-3 text-center md:text-left text-sm sm:text-base text-slate-700 font-serif">Ajouter un livre</a>
            </nav>
        </aside>

        <main class="flex-1 px-4 sm:px-6 py-6 sm:py-8">
            <section id="accueil" class="flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 rounded-xl p-5 sm:p-10 border border-indigo-100 bg-[#F3F5FF]">
                <img src="images/bienvenue.png" alt="bienvenue" class="w-20 sm:w-30 shrink-0">
                <div class="flex flex-col sm:mt-6 sm:pt-4">
                    <h2 class="font-bold text-lg text-black ">Bienvenue dans votre bibliothèque ! </h2>
                    <p class="mt-2 text-sm sm:text-base text-slate-600"> Découvrez, organisez et suivez vos livres préférés.</p>
                    <p class="mt-2 text-sm sm:text-base text-slate-600"  > Chaque livre est une nouvelle aventure ✨.</p>  
                </div>
            </section>
            <section id="recherche" class="flex flex-col sm:flex-row gap-3 sm:gap-4 my-8 ">
                <div class="flex flex-1 items-center gap-3 rounded-xl border border-slate-200 px-4 sm:px-5 py-4">
                    <img src="images/search.png" alt=" " class=" w-2 md:w-4 shrink-0">
                    <input type="search" placeholder="Rechercher un livre" class="w-full outline-none">
                </div>

                <select id="tri-livres" class="w-full sm:w-auto rounded-xl border border-slate-200 px-4 py-3 outline-none">
                    <option value="">Trier par..  </option>
                    <option value="titre">Titre</option>
                    <option value="auteur">Auteur</option>
                    <option value="annee">Année</option>

                </select>

                <button id="btn-ajouter" class=" w-full sm:w-auto rounded-xl bg-indigo-600 px-6 py-4 text-white"> + Ajouter un livre </button >
            </section>

            <section id="mes-livres" class="flex flex-col gap-2 text-start items-start my-8">

                <div>
                    <h2 class="font-bold text-xl font-serif"> Mes livres </h2>
                    <p class="mt-2 text-slate-600"> votre bibliothèque</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-8 lg:gap-10 mx-auto justify-items-center py-4" >
                </div>
            </section>

            <section id="formulaire-livre" class="hidden my-8 rounded-xl border border-slate-200 bg-white p-4 sm:p-6 shadow-sm">

                <h2 class="mb-6 text-xl font-bold text-slate-800"> Ajouter un nouveau livre </h2>
                
                <form id="form-livre" novalidate class="flex flex-col gap-5">

                    <div class="flex flex-col gap-2">
                       <label for="title" class="font-medium text-slate-700"> Titre du livre * </label>
                       <input
                           type="text"
                           id="title" 
                           name="title"
                           required 
                           class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
                           placeholder="Ex : Le Petit Prince"
                        > 
                        <p id="title-error" class="text-sm text-red-600"></p>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="author" class="font-medium text-slate-700"> Auteur * </label>
                        <input 
                            type="text"
                            id="author"
                            name="author"
                            required 
                            class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
                            placeholder="Nom de l'auteur"
                        >
                        <p id="author-error" class="text-sm text-red-600"></p>  
                    </div>

                    <div class="flex flex-col gap-2"> 
                        <label for="year" class="font-medium text-slate-700"> Année de publication </label>
                        <input
                            type="number"
                            id="year"
                            name="year" 
                            class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" 
                            placeholder="Ex : 2024" 
                        >
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="genre" class="font-medium text-slate-700"> Genre </label>
                        <input
                            type="text"
                            id="genre"
                            name="genre"
                            class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500" 
                            placeholder="Ex : Fantasy" 
                        > 
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="description" class="font-medium text-slate-700"> Description </label>
                        <textarea
                            id="description"
                            name="description"
                            rows="3"
                            class="rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500"
                            placeholder="Description du livre..." >
                        </textarea>
                    </div>

                    <div class="flex flex-col gap-2"> 
                        <label for="status" class="font-medium text-slate-700"> Statut de lecture </label>
                        <select 
                           id="status"
                           name="status"
                           class="rounded-lg border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500" >
                           <option value="to-read">À lire</option>
                           <option value="reading">En cours de lecture</option>
                           <option value="read">Lu</option>
                        </select>
                     </div>

                    <div class="flex flex-wrap gap-4">
                        <button type="submit" class="rounded-lg bg-indigo-600 px-6 py-3 font-medium text-white hover:bg-indigo-700" > Ajouter le livre </button>
                        <button type="button" id="annuler-ajout" class="rounded-lg border border-slate-300 px-6 py-3 font-medium text-slate-700 hover:bg-slate-100" > Annuler </button> 
                    </div>

                </form>

            </section>


        </main>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
